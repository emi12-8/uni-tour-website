<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour · Campus-Kompass EAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tourseite">

  <header class="tour-kopf">
    <a href="index.html" class="zurueck">← Start</a>
    <div class="tour-kopf__mitte">
      <img src="assets/logo/eah-mark.svg" alt="" width="22" height="22">
      <span>Campus-Kompass</span>
    </div>
    <a href="#" class="sprache" lang="en" aria-label="Switch to English">EN</a>
  </header>

  <main class="tour">

    <section class="tour__ansicht" aria-label="3D-Ansicht">
      <div class="route-leiste" id="route-leiste" hidden>
        <div>
          <p class="route-leiste__ziel" id="route-ziel"></p>
          <p class="route-leiste__info" id="route-info"></p>
        </div>
        <button type="button" class="knopf knopf--sekundaer knopf--klein" id="route-beenden">Beenden</button>
      </div>

      <canvas id="unity-canvas" class="unity-canvas" tabindex="-1" aria-label="3D-Ansicht des Campus"></canvas>

<div class="unity-laden" id="unity-laden">
  <p>3D-Ansicht wird geladen …</p>
  <div class="unity-laden__balken"><div id="unity-balken"></div></div>
</div>
    </section>

    <aside class="chat" aria-label="Chat mit dem Wegweiser">
      <div class="chat__kopf">
        <div class="avatar avatar--klein">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="tri__koerper" d="M50 10 Q55 10 58 16 L89 74 Q93 82 84 82 H16 Q7 82 11 74 L42 16 Q45 10 50 10Z"/>
            <circle class="tri__auge" cx="40" cy="55" r="7"/>
            <circle class="tri__auge" cx="60" cy="55" r="7"/>
            <circle class="tri__pupille" cx="41" cy="56" r="3.5"/>
            <circle class="tri__pupille" cx="61" cy="56" r="3.5"/>
          </svg>
        </div>
        <div>
          <p class="chat__name">Wegweiser</p>
          <p class="chat__status">online · EAH Jena</p>
        </div>
      </div>

      <ol class="chat__verlauf" id="chat-verlauf" aria-live="polite">
        <li class="nachricht nachricht--bot">Hallo! Wohin möchtest du?</li>
      </ol>

      <ul class="chips chips--scroll" aria-label="Vorschläge">
        <li><button type="button" class="chip" data-frage="Wo ist das Sekretariat?">Wo ist das Sekretariat?</button></li>
        <li><button type="button" class="chip" data-frage="Gibt es einen Aufzug?">Gibt es einen Aufzug?</button></li>
        <li><button type="button" class="chip" data-frage="Wo ist die nächste Toilette?">Wo ist die nächste Toilette?</button></li>
      </ul>

      <form class="chat__eingabe" id="chat-form" action="#">
        <div class="startwahl">
          <label for="start-suche" class="nur-screenreader">Standort</label>
          <input id="start-suche" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="start-liste" placeholder="Standort suchen" autocomplete="off" enterkeyhint="search">
          <ul class="startwahl__liste" id="start-liste" role="listbox" hidden></ul>
        </div>
        <p class="startwahl__hinweis" id="start-hinweis" hidden></p>
        <div class="chat__zeile">
          <label for="frage" class="nur-screenreader">Deine Frage an den Wegweiser</label>
          <input id="frage" type="text" placeholder="Wohin möchtest du?" autocomplete="off">
          <button type="submit" class="knopf knopf--primaer">Senden</button>
        </div>
      </form>
    </aside>

  </main>

  <script src="js/config.js?v=2"></script>
  <script src="js/startpunkte.js?v=2"></script>
  <script src="js/tour.js?v=2"></script>
  <script src="unity/Build/Unity_WebBuild.loader.js"></script>
  <script src="js/unity.js"></script>
</body>
</html>
